  on 2026-09-03 from WFS layer p_bz-Hydrology:WaterQuality-Watercourses and converted to GeoParquet. This
  copy is NOT the official publication: the authoritative source is the Province''s geoportal and open-data
  portal (https://data.civis.bz.it/dataset/qualita-dei-corsi-dacqua). Published for the OGC Metadata Summit
  2026 demo.'
