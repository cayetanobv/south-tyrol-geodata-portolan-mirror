description: 'Community mirror of the dataset «Sezioni di censimento 2021» published by the Provincia
  Autonoma di Bolzano – Alto Adige / Autonome Provinz Bozen – Südtirol as open data (CC0 1.0). Extracted
  on 2026-09-03 from WFS layer p_bz-Astat:CensusSections-2021 and converted to GeoParquet. This copy is
  NOT the official publication: the authoritative source is the Province''s geoportal and open-data portal
  (https://data.civis.bz.it/dataset/sezioni-di-censimento-2021). Published for the OGC Metadata Summit
  2026 demo.'
