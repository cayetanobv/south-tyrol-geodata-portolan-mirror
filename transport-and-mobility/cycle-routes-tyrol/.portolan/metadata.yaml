  on 2026-09-03 from WFS layer p_bz-TransportNetwork:Routes-Cycleways-Tyrol and converted to GeoParquet.
  This copy is NOT the official publication: the authoritative source is the Province''s geoportal and
  open-data portal (https://data.civis.bz.it/dataset/percorsi-ciclabili-del-tirolo). Published for the
  OGC Metadata Summit 2026 demo.'
