  from WFS layer p_bz-CulturalHeritage:HistoricalMonuments and converted to GeoParquet. This copy is NOT
  the official publication: the authoritative source is the Province''s geoportal and open-data portal
  (https://data.civis.bz.it/dataset/monumenti-architettonici). Published for the OGC Metadata Summit 2026
  demo.'
